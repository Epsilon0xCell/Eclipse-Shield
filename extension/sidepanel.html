<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eclipse Shield</title>
<style>
  @font-face {
    font-family: 'Share Tech Mono';
    src: url('assets/ShareTechMono-Regular.woff2') format('woff2');
    font-display: swap;
  }
  :root {
    --night: #000;
    --panel: rgba(0, 20, 0, 0.8);
    --panel-2: rgba(0, 40, 0, 0.8);
    --line: #0f0;
    --accent: #0f0;
    --accent-dim: #88ff88;
    --text: #0f0;
    --muted: #88ff88;
    --allow: #00ff00;
    --block: #ff4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: var(--night);
    color: var(--text);
    font-family: "Share Tech Mono", monospace;
    font-size: 14px;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .eclipse {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    background: #000;
    box-shadow: 0 0 0 2px var(--accent), 0 0 14px 2px rgba(0, 255, 0, .55);
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: .4px; text-shadow: 0 0 10px #0f0; }
  .tagline { color: var(--muted); margin: 2px 0 14px 40px; font-size: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 0; padding: 12px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--block); flex: none; }
  .dot.on { background: var(--allow); box-shadow: 0 0 8px rgba(0, 255, 0, .8); }
  .small { color: var(--muted); font-size: 12px; }
  .profiles { display: flex; gap: 6px; margin-top: 8px; }
  .profiles button {
    flex: 1; padding: 8px 0; border-radius: 0; cursor: pointer;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    font-family: inherit; font-size: 13px;
  }
  .profiles button.active {
    border-color: var(--accent); color: var(--accent);
    box-shadow: 0 0 10px rgba(0, 255, 0, .25) inset;
  }
  #checkBtn {
    width: 100%; padding: 10px; border: 1px solid var(--accent); border-radius: 0; cursor: pointer;
    background: linear-gradient(45deg, rgba(0,20,0,0.8), rgba(0,60,0,0.8));
    color: var(--accent); font-family: inherit; font-weight: 700; font-size: 14px;
  }
  #url { word-break: break-all; }
  #verdict { margin-top: 10px; display: none; }
  #verdict.show { display: block; }
  #verdict .state { font-size: 16px; font-weight: 700; }
  #verdict.allow .state { color: var(--allow); }
  #verdict.block .state { color: var(--block); }
  .chip {
    display: inline-block; padding: 1px 8px; border-radius: 0;
    border: 1px solid var(--line); color: var(--muted); font-size: 11px; margin-left: 6px;
  }
</style>
</head>
<body>
  <header>
    <div class="eclipse" aria-hidden="true"></div>
    <h1>Eclipse Shield</h1>
  </header>
  <p class="tagline">Shield protocol active.</p>

  <div class="card">
    <div class="row">
      <div id="healthDot" class="dot"></div>
      <div>
        <div id="healthText">Backend: checking...</div>
        <div class="small" id="healthMode">Start the local backend, then reopen this panel.</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div>Profile</div>
    <div class="profiles" id="profiles">
      <button data-profile="work">Work</button>
      <button data-profile="school">School</button>
      <button data-profile="personal">Personal</button>
    </div>
  </div>

  <div class="card">
    <div class="small">Current tab</div>
    <div id="url">No tab yet.</div>
    <div style="height:10px"></div>
    <button id="checkBtn">Check this site</button>
    <div id="verdict">
      <span class="state" id="verdictState"></span><span class="chip" id="verdictSource"></span>
      <div id="verdictReason" style="margin-top:6px"></div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
