<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Lighthouse gallery at night: a distant ship light crosses, a lantern sways, the ship bell rocks, a feather drifts past">
<rect width="1200" height="340" fill="#16202e"/>
<rect y="200" width="1200" height="140" fill="#1d3038"/>
<g id="far-ship"><circle cx="0" cy="196" r="5" fill="#ffd678"><animate attributeName="cx" from="40" to="1160" dur="46s" repeatCount="indefinite"/></circle><circle cx="0" cy="196" r="12" fill="#ffd678" opacity="0.25"><animate attributeName="cx" from="40" to="1160" dur="46s" repeatCount="indefinite"/></circle></g>
<g id="far-gulls" fill="none" stroke="#cfe0f2" stroke-width="2"><path d="M0 0 q6 -6 12 0 q6 -6 12 0"><animateTransform attributeName="transform" type="translate" from="120 60" to="980 44" dur="38s" repeatCount="indefinite"/></path></g>
<line x1="0" y1="238" x2="1200" y2="238" stroke="#c69e4a" stroke-width="5"/>
<g id="mid-lantern"><g><animateTransform attributeName="transform" type="rotate" values="-7 300 238;7 300 238;-7 300 238" dur="5s" repeatCount="indefinite"/><line x1="300" y1="238" x2="300" y2="262" stroke="#c69e4a" stroke-width="3"/><rect x="286" y="262" width="28" height="38" fill="#10141a"/><rect x="292" y="268" width="16" height="24" fill="#ffc45e"/><ellipse cx="300" cy="281" rx="4" ry="8" fill="#fff2c8"><animate attributeName="rx" values="4;2.6;4" dur="1.6s" repeatCount="indefinite"/></ellipse></g></g>
<g id="mid-bell"><g><animateTransform attributeName="transform" type="rotate" values="0 620 238;2 620 238;0 620 238;-2 620 238;0 620 238" dur="9s" repeatCount="indefinite"/><path d="M606 246 h28 l6 26 h-40 z" fill="#c69e4a"/><circle cx="620" cy="276" r="5" fill="#c69e4a"/></g></g>
<g id="mid-rope"><g><animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="11s" repeatCount="indefinite"/><g fill="none" stroke="#96703c" stroke-width="6"><ellipse cx="880" cy="292" rx="52" ry="15"/><ellipse cx="880" cy="298" rx="34" ry="10"/></g></g></g>
<g id="near-feather"><g opacity="0.92"><animateTransform attributeName="transform" type="translate" values="-80 300;1240 210" dur="20s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="20s" repeatCount="indefinite"/><path d="M0 0 q26 -12 52 -2 q-26 4 -52 2" fill="#eef0e8"/><line x1="0" y1="0" x2="52" y2="-2" stroke="#c9cdc2" stroke-width="2"/></g></g></g>
</svg>